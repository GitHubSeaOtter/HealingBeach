name: Check beach app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Ensure the Pages entry point matches the source
        run: git diff --exit-code -- index.html
      - uses: actions/upload-artifact@v4
        with:
          name: healing-beach-dist
          path: dist
